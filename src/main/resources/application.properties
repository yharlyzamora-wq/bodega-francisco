spring.application.name=bodega-francisco
server.port=8080

# Base de datos H2 en archivo (carpeta ./data). No requiere instalar nada.
spring.datasource.url=jdbc:h2:file:./data/bodega_apf3
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

# Cuenta administradora: application-local.properties (ignorado por Git) o variables de entorno
spring.config.import=optional:file:./application-local.properties
bodega.admin.correo=${ADMIN_CORREO:}
bodega.admin.password=${ADMIN_PASSWORD:}

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.thymeleaf.cache=false
logging.config=classpath:logback-spring.xml
