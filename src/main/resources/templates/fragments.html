<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="cabeza(titulo)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="'Bodega Francisco | ' + ${titulo}">Bodega Francisco</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/bodega.css}">
</head>
<body>

<!-- Íconos (se incluye una vez por página) -->
<svg th:fragment="iconos" xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-store" viewBox="0 0 24 24"><path d="M3 9l1.5-5h15L21 9M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0M5 12v8h14v-8M10 20v-5h4v5"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7zM3 7l9 5 9-5M12 12v10"/></symbol>
  <symbol id="i-stack" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="8" y="14" width="8" height="7" rx="1"/></symbol>
  <symbol id="i-cart" viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h10.2l2-8H6.2"/><circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/></symbol>
  <symbol id="i-card" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.5 0 4.5 2 4.5 5"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><rect x="4" y="12" width="4" height="8"/><rect x="10" y="7" width="4" height="13"/><rect x="16" y="3" width="4" height="17"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 4h16v12H9l-5 4z"/><path d="M8 9h8M8 12h5"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3l10 18H2zM12 10v5M12 18v.01"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
</svg>

<!-- Barra pública -->
<header class="barra" th:fragment="barra">
  <a class="marca" th:href="@{/}"><svg class="i"><use href="#i-store"/></svg>BODEGA FRANCISCO</a>
  <nav aria-label="Principal">
    <a th:href="@{/catalogo}">Catálogo</a>
    <a sec:authorize="hasAnyRole('ADMIN','PERSONAL')" th:href="@{/admin}">Panel</a>
    <a sec:authorize="!isAuthenticated()" th:href="@{/login}">Ingresar</a>
    <a sec:authorize="!isAuthenticated()" class="cta" th:href="@{/registro}">Crear cuenta</a>
    <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
      <button type="submit" class="enlace">Cerrar sesión</button>
    </form>
  </nav>
</header>

<!-- Barra del panel -->
<header class="barra" th:fragment="barraAdmin">
  <a class="marca" th:href="@{/admin}"><svg class="i"><use href="#i-store"/></svg>BODEGA FRANCISCO</a>
  <div class="usuario">
    <strong><span sec:authorize="hasRole('ADMIN')">Administrador</span><span sec:authorize="!hasRole('ADMIN')">Personal</span></strong>
    <form th:action="@{/logout}" method="post"><button type="submit" class="salir-link">Cerrar sesión</button></form>
  </div>
</header>

<!-- Menú lateral: los módulos sin construir salen apagados -->
<nav class="menu" th:fragment="menuAdmin(activo)" aria-label="Módulos">
  <a th:href="@{/admin}" th:classappend="${activo == 'inicio'} ? 'on'"><svg class="i"><use href="#i-home"/></svg>Inicio</a>
  <a class="pronto" aria-disabled="true" tabindex="-1" title="Próximamente"><svg class="i"><use href="#i-box"/></svg>Productos</a>
  <a class="pronto" aria-disabled="true" tabindex="-1" title="Próximamente"><svg class="i"><use href="#i-stack"/></svg>Inventario</a>
  <a class="pronto" aria-disabled="true" tabindex="-1" title="Próximamente"><svg class="i"><use href="#i-cart"/></svg>Pedidos</a>
  <a class="pronto" aria-disabled="true" tabindex="-1" title="Próximamente"><svg class="i"><use href="#i-card"/></svg>Pagos</a>
  <a class="pronto" aria-disabled="true" tabindex="-1" title="Próximamente"><svg class="i"><use href="#i-users"/></svg>Clientes</a>
  <a class="pronto" aria-disabled="true" tabindex="-1" title="Próximamente"><svg class="i"><use href="#i-chart"/></svg>Reportes</a>
  <a class="pronto" aria-disabled="true" tabindex="-1" title="Próximamente"><svg class="i"><use href="#i-chat"/></svg>Reclamos</a>
  <a class="pronto" aria-disabled="true" tabindex="-1" title="Próximamente"><svg class="i"><use href="#i-gear"/></svg>Configuración</a>
</nav>

<footer class="pie" th:fragment="pie">Bodega Francisco · Proyecto APF3 · UTP</footer>
</body>
</html>
