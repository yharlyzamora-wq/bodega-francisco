<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: cabeza('Producto')}"></head>

<body>
    <svg th:replace="~{fragments :: iconos}"></svg>
    <header th:replace="~{fragments :: barraAdmin}"></header>
    <div class="shell">
        <nav th:replace="~{fragments :: menuAdmin('productos')}"></nav>

        <main class="principal">
            <section class="panel form-admin formulario-producto">
                <h1 th:text="${producto == null} ? 'Nuevo producto' : 'Editar producto'">Nuevo producto</h1>
                <p class="sub" th:if="${producto != null}" th:text="'Código: ' + ${producto.codigo}"></p>
                <p class="sub" th:if="${producto == null}">El código se genera automáticamente.</p>
                <p class="aviso error" th:if="${errorNegocio}" th:text="${errorNegocio}" role="alert"></p>

                <form th:object="${form}" method="post"
                    th:action="${producto == null} ? @{/admin/productos} : @{/admin/productos/{id}(id=${producto.id})}">
                    <label for="nombre">Nombre</label>
                    <input id="nombre" th:field="*{nombre}" maxlength="120" required>
                    <span class="campo-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>

                    <label for="categoriaId">Categoría</label>
                    <select id="categoriaId" th:field="*{categoriaId}" required>
                        <option value="">Selecciona una categoría</option>
                        <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"></option>
                    </select>
                    <span class="campo-error" th:if="${#fields.hasErrors('categoriaId')}"
                        th:errors="*{categoriaId}"></span>

                    <label for="precio">Precio (S/)</label>
                    <input id="precio" type="number" step="0.01" min="0.01" max="9999.99" th:field="*{precio}" required
                        inputmode="decimal">
                    <span class="campo-error" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></span>

                    <th:block th:if="${producto == null}">
                        <label for="stock">Stock inicial</label>
                        <input id="stock" type="number" step="1" min="0" max="100000" th:field="*{stock}" required
                            inputmode="numeric">
                        <span class="campo-error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></span>
                    </th:block>
                    <p class="ayuda" th:if="${producto != null}"
                        th:text="'Stock actual: ' + ${producto.stock} + ' unidades. Para cambiarlo usa «Actualizar stock» en el listado.'">
                    </p>

                    <div class="botones">
                        <button class="btn" type="submit"><svg class="i">
                                <use href="#i-save" />
                            </svg>Guardar</button>
                        <a class="btn sec" th:href="@{/admin/productos}">Cancelar</a>
                    </div>
                </form>
            </section>
        </main>
    </div>
</body>

</html>
