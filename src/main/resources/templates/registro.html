<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: cabeza('Crear cuenta')}"></head>
<body>
  <svg th:replace="~{fragments :: iconos}"></svg>
  <header th:replace="~{fragments :: barra}"></header>
  <main class="fondo-auth">
    <section class="auth">
      <div class="avatar" aria-hidden="true"><svg class="i"><use href="#i-user"/></svg></div>
      <h1>Crear cuenta</h1>
      <p class="sub">Regístrate para hacer pedidos y seguirlos desde la web.</p>
      <p class="aviso error" th:if="${errorNegocio}" th:text="${errorNegocio}" role="alert"></p>

      <form th:action="@{/registro}" th:object="${form}" method="post">
        <div class="fila">
          <div>
            <label for="nombre">Nombre</label>
            <div class="campo"><svg class="i"><use href="#i-user"/></svg>
              <input id="nombre" th:field="*{nombre}" maxlength="80" autocomplete="given-name"></div>
            <span class="campo-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
          </div>
          <div>
            <label for="apellido">Apellido</label>
            <div class="campo"><svg class="i"><use href="#i-user"/></svg>
              <input id="apellido" th:field="*{apellido}" maxlength="80" autocomplete="family-name"></div>
            <span class="campo-error" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></span>
          </div>
        </div>

        <label for="correo">Correo electrónico</label>
        <div class="campo"><svg class="i"><use href="#i-mail"/></svg>
          <input id="correo" type="email" th:field="*{correo}" maxlength="120" autocomplete="email"></div>
        <span class="campo-error" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></span>

        <label for="celular">Celular (opcional)</label>
        <div class="campo"><svg class="i"><use href="#i-user"/></svg>
          <input id="celular" th:field="*{celular}" maxlength="15" inputmode="numeric" autocomplete="tel"></div>
        <span class="campo-error" th:if="${#fields.hasErrors('celular')}" th:errors="*{celular}"></span>

        <label for="password">Contraseña (mínimo 8, con letras y números)</label>
        <div class="campo"><svg class="i"><use href="#i-lock"/></svg>
          <input id="password" type="password" name="password" maxlength="100" autocomplete="new-password"></div>
        <span class="campo-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>

        <label for="confirmacion">Repite la contraseña</label>
        <div class="campo"><svg class="i"><use href="#i-lock"/></svg>
          <input id="confirmacion" type="password" name="confirmacion" maxlength="100" autocomplete="new-password"></div>
        <span class="campo-error" th:if="${#fields.hasErrors('confirmacion')}" th:errors="*{confirmacion}"></span>

        <button class="btn" type="submit">Crear cuenta</button>
      </form>
      <a class="btn sec" th:href="@{/login}">Ya tengo cuenta</a>
    </section>
  </main>
</body>
</html>
