<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: cabeza('Ingresar')}"></head>
<body>
  <svg th:replace="~{fragments :: iconos}"></svg>
  <header th:replace="~{fragments :: barra}"></header>
  <main class="fondo-auth">
    <section class="auth">
      <div class="avatar" th:classappend="${admin} ? 'admin'" aria-hidden="true">
        <svg class="i" th:if="${admin}"><use href="#i-gear"/></svg>
        <svg class="i" th:unless="${admin}"><use href="#i-cart"/></svg>
      </div>
      <h1 th:text="${admin} ? 'Ingreso Administrador' : 'Ingreso Cliente'">Ingreso Cliente</h1>
      <p class="sub" th:text="${admin} ? 'Acceso al panel interno de la bodega.' : 'Accede para consultar productos, realizar pedidos y revisar el estado de tu compra.'"></p>

      <p class="aviso ok" th:if="${param.registrado}">Cuenta creada. Ya puedes ingresar.</p>
      <p class="aviso error" th:if="${param.error != null and param.error[0] == 'bloqueado'}" role="alert">Demasiados intentos. Espera 15 minutos e inténtalo de nuevo.</p>
      <p class="aviso error" th:if="${param.error != null and param.error[0] != 'bloqueado'}" role="alert">Correo o contraseña incorrectos.</p>

      <form th:action="@{/login}" method="post">
        <input type="hidden" name="origen" th:value="${admin} ? 'admin' : 'cliente'">
        <label for="correo">Correo electrónico</label>
        <div class="campo">
          <svg class="i"><use href="#i-mail"/></svg>
          <input id="correo" name="correo" type="email" autocomplete="username" required maxlength="120" placeholder="ejemplo@bodegafrancisco.com">
        </div>
        <label for="password">Contraseña</label>
        <div class="campo">
          <svg class="i"><use href="#i-lock"/></svg>
          <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="100" placeholder="Ingresa tu contraseña">
          <button type="button" class="ver" id="ver" aria-label="Mostrar contraseña"><svg class="i"><use href="#i-eye"/></svg></button>
        </div>
        <button class="btn" type="submit">Iniciar sesión</button>
      </form>
      <a class="btn sec" th:if="${!admin}" th:href="@{/registro}">Crear cuenta</a>
      <p class="nota"><svg class="i"><use href="#i-lock"/></svg>
        <span th:text="${admin} ? 'Acceso solo para personal autorizado' : 'Acceso desde la web de la bodega'"></span></p>
    </section>
  </main>
  <script>
    (function () {
      var campo = document.getElementById('password'), boton = document.getElementById('ver');
      boton.addEventListener('click', function () {
        var oculto = campo.type === 'password';
        campo.type = oculto ? 'text' : 'password';
        boton.setAttribute('aria-label', oculto ? 'Ocultar contraseña' : 'Mostrar contraseña');
      });
    })();
  </script>
</body>
</html>
